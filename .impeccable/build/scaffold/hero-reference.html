<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-b1-abertura.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata:wght@400&family=Catamaran:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-masthead-mark region chrome" data-region="masthead-mark"><!-- small flat black Missionária symbol at the left of the masthead --></div>
  <div class="r-masthead-name region text" data-region="masthead-name"><!-- MISSIONÁRIA HUB set in wide black caps, the product name --><p style="font-size:var(--r-masthead-name-font);line-height:1.05;margin:0">masthead-name</p></div>
  <div class="r-nav-vimos region control" data-region="nav-vimos"><!-- navigation link O que vimos in small black grotesk: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-vimos); a control need not have button chrome --></div>
  <div class="r-nav-funciona region control" data-region="nav-funciona"><!-- navigation link Como funciona in small black grotesk: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-funciona); a control need not have button chrome --></div>
  <div class="r-nav-perguntas region control" data-region="nav-perguntas"><!-- navigation link Perguntas in small black grotesk: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-perguntas); a control need not have button chrome --></div>
  <div class="r-nav-conversa region control" data-region="nav-conversa"><!-- navigation link Conversa in small black grotesk: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-conversa); a control need not have button chrome --></div>
  <div class="r-headline region text" data-region="headline"><!-- three-line didone headline: Pastor, antes de começar o aplicativo, a gente precisa ouvir o senhor. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subline region text" data-region="subline"><!-- one plain grotesk line: São 37 perguntas, uns 45 minutos. Dá para parar e continuar depois. --><p style="font-size:var(--r-subline-font);font-family:var(--r-subline-family),sans-serif;font-weight:var(--r-subline-weight);line-height:1.05;margin:0">subline</p></div>
  <div class="r-cta region control" data-region="cta"><!-- solid black button with white label Começar as perguntas: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta); a control need not have button chrome --></div>
  <div class="r-faixa-preta region chrome" data-region="faixa-preta"><!-- top edge of the next full-bleed black section --></div>
  <div class="r-simbolo-losango region chrome" data-region="simbolo-losango"><!-- diamond, top piece of the official Missionária logo symbol, a solid flat black shape set in the SVG logo; moves on its own in the signature interaction --></div>
  <div class="r-simbolo-chevron region chrome" data-region="simbolo-chevron"><!-- chevron, middle piece of the official Missionária logo symbol, a solid flat black shape set in the SVG logo; moves on its own in the signature interaction --></div>
  <div class="r-simbolo-coracao region chrome" data-region="simbolo-coracao"><!-- heart, bottom piece of the official Missionária logo symbol, a solid flat black shape set in the SVG logo, cropped by the right edge; moves on its own in the signature interaction --></div>
</main>
</body>
</html>
